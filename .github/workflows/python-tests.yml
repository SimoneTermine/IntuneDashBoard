name: Sync status tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-status-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest PySide6 SQLAlchemy requests msal

      - name: Run sync status tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_sync_status.py -q
